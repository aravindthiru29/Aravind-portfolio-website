<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Aravind Portfolio</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="admin-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="admin-logo-icon"><i class="fas fa-shield-alt"></i></div>
            <h1>Reset Password</h1>
            <div class="accent-bar"></div>
            <p class="subtitle">Enter the 6-digit code sent to your email or your Master Recovery Key</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="admin-alert admin-alert-{{ category }}">
                    <i class="fas {% if category == 'success' %}fa-check-circle{% elif category == 'danger' %}fa-exclamation-circle{% else %}fa-info-circle{% endif %}"></i>
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin_reset_password') }}" autocomplete="off">
                <div class="admin-input-group">
                    <label for="code">Verification Code or Recovery Key</label>
                    <input type="text" id="code" name="code" class="admin-input" placeholder="Enter 6-digit code or recovery key" required autofocus />
                </div>

                <div class="admin-input-group">
                    <label for="new_password">New Password</label>
                    <div style="position: relative;">
                        <input type="password" id="new_password" name="new_password" class="admin-input" placeholder="Min. 6 characters" required minlength="6" />
                        <button type="button" class="password-toggle-btn" id="toggleNewPw" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="admin-input-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div style="position: relative;">
                        <input type="password" id="confirm_password" name="confirm_password" class="admin-input" placeholder="Re-enter new password" required minlength="6" />
                        <button type="button" class="password-toggle-btn" id="toggleConfirmPw" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="admin-btn admin-btn-block" style="margin-top: 12px;">
                    <i class="fas fa-check-circle"></i> Set New Password
                </button>
            </form>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; font-size: 0.82rem;">
                <a href="{{ url_for('admin_login') }}" style="color: var(--text-muted); text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
                <a href="{{ url_for('admin_forgot_password') }}" style="color: var(--accent); text-decoration: none;">
                    <i class="fas fa-redo"></i> Resend Code
                </a>
            </div>
        </div>
    </div>

    <script>
        function setupToggle(btnId, inputId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            if (btn && input) {
                btn.addEventListener('click', function () {
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    const icon = this.querySelector('i');
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                });
            }
        }
        setupToggle('toggleNewPw', 'new_password');
        setupToggle('toggleConfirmPw', 'confirm_password');
    </script>
</body>
</html>
